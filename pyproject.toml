[project]
name = "oddsfox-kalshi-events"
version = "0.1.0"
description = "Bounded public Kalshi native catalogue and immutable metadata handoffs"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12,<3.13"
dependencies = ["dlt[duckdb,parquet]>=1.10", "dbt-core>=1.10", "dbt-duckdb>=1.9", "httpx>=0.27", "filelock>=3.15", "pyarrow>=17"]
[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6"]
[project.scripts]
kalshi-events = "kalshi_events.cli:main"
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/kalshi_events"]
[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "scripts", "pyproject.toml", "uv.lock", "README.md", "LICENSE"]
[tool.hatch.build]
exclude = ["**/__pycache__/**", "**/target/**", "**/logs/**", "**/.user.yml", "**/data/**"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
timeout = 120
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
